<!-- Galería de fotos a pantalla completa. Uso: QSGaleria.abrir(titulo, subtitulo, [urls], indiceInicial) -->
<style>
  #qsg { position: fixed; inset: 0; z-index: 200; display: none; flex-direction: column; background: rgba(8,20,52,0.94); }
  #qsg.open { display: flex; }
  .qsg-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; color: #fff; }
  .qsg-title { font-weight: 700; font-size: 1.05rem; line-height: 1.3; }
  .qsg-sub { font-size: 0.85rem; color: #cfdcff; margin-top: 0.15rem; }
  .qsg-count { font-size: 0.85rem; color: #cfdcff; white-space: nowrap; }
  .qsg-close { background: rgba(255,255,255,0.12); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .qsg-close:hover { background: rgba(255,255,255,0.22); }
  .qsg-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 4rem; }
  .qsg-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 0.75rem; background: #0b2a6b; }
  .qsg-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%;
    background: #fff; color: #0f2252; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .qsg-nav:hover { background: #eaf1ff; }
  .qsg-prev { left: 0.9rem; } .qsg-next { right: 0.9rem; }
  .qsg-thumbs { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.75rem 1rem 1rem; scrollbar-width: thin; }
  .qsg-thumb { flex: 0 0 auto; width: 88px; height: 62px; padding: 0; border-radius: 0.5rem; overflow: hidden; border: 2px solid transparent; background: #0b2a6b; opacity: 0.65; cursor: pointer; }
  .qsg-thumb.on { border-color: #fff; opacity: 1; }
  .qsg-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 640px) {
    .qsg-stage { padding: 0 0.5rem; }
    .qsg-nav { width: 38px; height: 38px; } .qsg-prev { left: 0.4rem; } .qsg-next { right: 0.4rem; }
    .qsg-thumb { width: 68px; height: 50px; }
  }
</style>

<div id="qsg" role="dialog" aria-modal="true" aria-labelledby="qsg-title">
  <div class="qsg-head">
    <div style="min-width:0">
      <div class="qsg-title" id="qsg-title"></div>
      <div class="qsg-sub" id="qsg-sub"></div>
    </div>
    <div style="display:flex;align-items:center;gap:0.9rem">
      <span class="qsg-count" id="qsg-count" aria-live="polite"></span>
      <button type="button" class="qsg-close" id="qsg-cerrar" aria-label="Cerrar galería">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="qsg-stage" id="qsg-stage">
    <button type="button" class="qsg-nav qsg-prev" id="qsg-prev" aria-label="Foto anterior">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <img class="qsg-img" id="qsg-img" alt="" />
    <button type="button" class="qsg-nav qsg-next" id="qsg-next" aria-label="Foto siguiente">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="qsg-thumbs" id="qsg-thumbs" role="tablist" aria-label="Miniaturas"></div>
</div>

<script>
window.QSGaleria = (function () {
  var el, img, thumbs, count, tituloEl, subEl, lista = [], i = 0, titulo = '', previo = null

  function $(id) { return document.getElementById(id) }

  function mostrar(n) {
    if (!lista.length) return
    i = (n + lista.length) % lista.length
    img.src = lista[i]
    img.alt = titulo + ' — foto ' + (i + 1) + ' de ' + lista.length
    count.textContent = (i + 1) + ' / ' + lista.length
    thumbs.querySelectorAll('.qsg-thumb').forEach(function (b, k) {
      var on = k === i
      b.classList.toggle('on', on)
      b.setAttribute('aria-selected', on ? 'true' : 'false')
      if (on) b.scrollIntoView({ block: 'nearest', inline: 'center' })
    })
    var sig = new Image(); sig.src = lista[(i + 1) % lista.length]
  }

  function abrir(t, sub, imagenes, idx) {
    lista = (imagenes || []).filter(Boolean)
    if (!lista.length) return
    titulo = t || ''
    tituloEl.textContent = titulo
    subEl.textContent = sub || ''
    thumbs.innerHTML = ''
    lista.forEach(function (u, k) {
      var b = document.createElement('button')
      b.type = 'button'; b.className = 'qsg-thumb'; b.setAttribute('role', 'tab')
      b.setAttribute('aria-label', 'Ver foto ' + (k + 1))
      var im = document.createElement('img'); im.src = u; im.loading = 'lazy'; im.alt = ''
      b.appendChild(im)
      b.addEventListener('click', function () { mostrar(k) })
      thumbs.appendChild(b)
    })
    var multiples = lista.length > 1
    $('qsg-prev').style.display = multiples ? '' : 'none'
    $('qsg-next').style.display = multiples ? '' : 'none'
    thumbs.style.display = multiples ? '' : 'none'
    previo = document.activeElement
    el.classList.add('open')
    document.body.style.overflow = 'hidden'
    mostrar(idx || 0)
    $('qsg-cerrar').focus()
  }

  function cerrar() {
    el.classList.remove('open')
    document.body.style.overflow = ''
    img.removeAttribute('src')
    if (previo && previo.focus) previo.focus()
  }

  document.addEventListener('DOMContentLoaded', function () {
    el = $('qsg'); img = $('qsg-img'); thumbs = $('qsg-thumbs'); count = $('qsg-count')
    tituloEl = $('qsg-title'); subEl = $('qsg-sub')
    $('qsg-cerrar').addEventListener('click', cerrar)
    $('qsg-prev').addEventListener('click', function () { mostrar(i - 1) })
    $('qsg-next').addEventListener('click', function () { mostrar(i + 1) })
    $('qsg-stage').addEventListener('click', function (e) { if (e.target === this) cerrar() })
    document.addEventListener('keydown', function (e) {
      if (!el.classList.contains('open')) return
      if (e.key === 'Escape') cerrar()
      else if (e.key === 'ArrowLeft') mostrar(i - 1)
      else if (e.key === 'ArrowRight') mostrar(i + 1)
    })
    var x0 = null
    var st = $('qsg-stage')
    st.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX }, { passive: true })
    st.addEventListener('touchend', function (e) {
      if (x0 === null) return
      var d = x0 - e.changedTouches[0].clientX
      if (Math.abs(d) > 45) mostrar(i + (d > 0 ? 1 : -1))
      x0 = null
    }, { passive: true })
  })

  return { abrir: abrir, cerrar: cerrar }
})()
</script>
