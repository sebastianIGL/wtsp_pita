<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Subsidios — Crear contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-from: #0f0a1e;
      --bg-via: #1e1050;
      --glass-bg: rgba(124,58,237,0.07);
      --glass-border: rgba(167,139,250,0.15);
      --label: #c4b5fd;
      --muted: #a78bfa;
      --footer: #4c3d8a;
      --inp-bg: #1a1035;
      --inp-border: #4c1d95;
      --inp-text: #ede9fe;
      --inp-ph: #7c5cbf;
      --heading: #f5f3ff;
    }
    [data-theme="light"] {
      --bg-from: #f5f3ff;
      --bg-via: #ede9fe;
      --glass-bg: rgba(255,255,255,0.85);
      --glass-border: rgba(124,58,237,0.25);
      --label: #5b21b6;
      --muted: #7c3aed;
      --footer: #a78bfa;
      --inp-bg: #ffffff;
      --inp-border: #ddd6fe;
      --inp-text: #1e1b4b;
      --inp-ph: #a78bfa;
      --heading: #1e1b4b;
    }
    body {
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-via) 60%, var(--bg-from) 100%);
      min-height: 100vh;
    }
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
    }
    .inp {
      width: 100%;
      background: var(--inp-bg);
      border: 1px solid var(--inp-border);
      color: var(--inp-text);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      outline: none;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .inp:focus { box-shadow: 0 0 0 2px #7c3aed; border-color: transparent; }
    .inp::placeholder { color: var(--inp-ph); }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px var(--inp-bg) inset;
      -webkit-text-fill-color: var(--inp-text);
    }
    .lbl     { display: block; color: var(--label); font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
    .heading { color: var(--heading); }
    .muted   { color: var(--muted); }

    .theme-btn {
      position: fixed; top: 1rem; right: 1rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 9999px;
      padding: 0.5rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
      color: var(--muted);
    }
    .theme-btn:hover { color: var(--heading); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <!-- Toggle claro/oscuro -->
  <button class="theme-btn" id="themeToggle" title="Cambiar tema">
    <svg id="iconMoon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
    </svg>
    <svg id="iconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
    </svg>
  </button>

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-violet-600 mb-4 shadow-lg shadow-violet-500/30">
        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none">
          <circle cx="4"    cy="6"    r="1.8" fill="currentColor"/>
          <circle cx="4"    cy="12"   r="1.8" fill="currentColor"/>
          <circle cx="4"    cy="18"   r="1.8" fill="currentColor"/>
          <circle cx="12.5" cy="8.5"  r="1.8" fill="currentColor"/>
          <circle cx="12.5" cy="15.5" r="1.8" fill="currentColor"/>
          <circle cx="20"   cy="12"   r="1.8" fill="currentColor"/>
          <line x1="5.8" y1="6.3"  x2="10.7" y2="8.2"  stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="6.6"  x2="10.7" y2="15.0" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="12"   x2="10.7" y2="8.8"  stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="12"   x2="10.7" y2="15.2" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="17.7" x2="10.7" y2="9.0"  stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="17.8" x2="10.7" y2="15.5" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="14.3" y1="8.8"  x2="18.2" y2="11.5" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="14.3" y1="15.2" x2="18.2" y2="12.5" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold heading">CRM Subsidios</h1>
      <p class="muted text-sm mt-1">Crea tu contraseña para acceder</p>
    </div>

    <div class="glass rounded-2xl p-8 shadow-2xl">
      <div id="alerta" class="hidden mb-5 px-4 py-3 rounded-lg text-sm font-medium"></div>

      <div id="cargando" class="text-center py-6">
        <div class="inline-block w-6 h-6 border-2 border-violet-500 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="muted text-sm">Verificando enlace…</p>
      </div>

      <form id="formReset" class="hidden space-y-5">
        <div>
          <label class="lbl">Nueva contraseña</label>
          <input id="pwd1" type="password" required minlength="8"
            placeholder="Mínimo 8 caracteres" class="inp" />
        </div>
        <div>
          <label class="lbl">Confirmar contraseña</label>
          <input id="pwd2" type="password" required minlength="8"
            placeholder="Repite tu contraseña" class="inp" />
        </div>
        <button type="submit" id="btnReset"
          class="w-full bg-violet-600 hover:bg-violet-500 text-white font-semibold rounded-lg py-3 text-sm
                 transition-all shadow-lg shadow-violet-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
          Guardar contraseña
        </button>
      </form>
    </div>

    <p class="text-center text-xs mt-6" style="color: var(--footer)">CRM Subsidios &copy; 2026</p>
  </div>

<script>
  // ── Tema ──────────────────────────────────────────────────────────────────
  const html = document.documentElement;
  const savedTheme = localStorage.getItem('crm-theme');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initTheme  = savedTheme || (systemDark ? 'dark' : 'light');
  html.setAttribute('data-theme', initTheme);
  document.getElementById('iconMoon').classList.toggle('hidden', initTheme === 'light');
  document.getElementById('iconSun').classList.toggle('hidden',  initTheme === 'dark');

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('crm-theme', next);
    document.getElementById('iconMoon').classList.toggle('hidden', next === 'light');
    document.getElementById('iconSun').classList.toggle('hidden',  next === 'dark');
  });

  // ── Supabase ──────────────────────────────────────────────────────────────
  const SUPABASE_URL  = 'https://vomqfihcrhjcvxjsloob.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvbXFmaWhjcmhqY3Z4anNsb29iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5OTM3MDQsImV4cCI6MjA4ODU2OTcwNH0.uBgd-aOeochLcomuQM8o_R-Sfl_JJ-7WsB1-wSwLGIc';
  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  function mostrarAlerta(msg, tipo = 'error') {
    const el = document.getElementById('alerta');
    el.className = `mb-5 px-4 py-3 rounded-lg text-sm font-medium ${
      tipo === 'error' ? 'bg-red-900/60 text-red-300 border border-red-700'
      : tipo === 'ok'  ? 'bg-green-900/60 text-green-300 border border-green-700'
      : 'bg-amber-900/60 text-amber-300 border border-amber-700'
    }`;
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  async function init() {
    const params     = new URLSearchParams(window.location.search);
    const token_hash = params.get('token_hash');
    const type       = params.get('type');

    if (token_hash && type) {
      const { error } = await _supabase.auth.verifyOtp({ token_hash, type });
      document.getElementById('cargando').classList.add('hidden');
      if (error) { mostrarAlerta('El enlace no es válido o ya expiró. Solicita uno nuevo.', 'error'); return; }
    } else {
      const { data: { session }, error } = await _supabase.auth.getSession();
      document.getElementById('cargando').classList.add('hidden');
      if (error || !session) { mostrarAlerta('El enlace no es válido o ya expiró. Solicita uno nuevo.', 'error'); return; }
    }
    document.getElementById('formReset').classList.remove('hidden');
  }

  document.getElementById('formReset').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwd1 = document.getElementById('pwd1').value;
    const pwd2 = document.getElementById('pwd2').value;
    if (pwd1 !== pwd2) { mostrarAlerta('Las contraseñas no coinciden'); return; }
    if (pwd1.length < 8) { mostrarAlerta('Mínimo 8 caracteres'); return; }

    const btn = document.getElementById('btnReset');
    btn.disabled = true;
    btn.textContent = 'Guardando…';

    const { error } = await _supabase.auth.updateUser({ password: pwd1 });
    if (error) {
      mostrarAlerta(error.message || 'Error al guardar');
      btn.disabled = false;
      btn.textContent = 'Guardar contraseña';
      return;
    }

    mostrarAlerta('Contraseña creada correctamente. Redirigiendo…', 'ok');
    setTimeout(() => window.location.href = '/index.html', 1500);
  });

  init();
</script>
</body>
</html>
