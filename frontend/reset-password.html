<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Subsidios — Crear contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 60%, #0f172a 100%); min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #1e293b inset; -webkit-text-fill-color: #e2e8f0; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 mb-4 shadow-lg shadow-blue-500/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">CRM Subsidios</h1>
      <p class="text-slate-400 text-sm mt-1">Crea tu contraseña para acceder</p>
    </div>

    <div class="glass rounded-2xl p-8 shadow-2xl">
      <div id="alerta" class="hidden mb-5 px-4 py-3 rounded-lg text-sm font-medium"></div>

      <div id="cargando" class="text-center py-6">
        <div class="inline-block w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-slate-400 text-sm">Verificando enlace…</p>
      </div>

      <form id="formReset" class="hidden space-y-5">
        <div>
          <label class="block text-slate-300 text-sm font-medium mb-1.5">Nueva contraseña</label>
          <input id="pwd1" type="password" required minlength="8" placeholder="Mínimo 8 caracteres"
            class="w-full bg-slate-800 border border-slate-600 text-slate-100 rounded-lg px-4 py-3 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-500 transition" />
        </div>
        <div>
          <label class="block text-slate-300 text-sm font-medium mb-1.5">Confirmar contraseña</label>
          <input id="pwd2" type="password" required minlength="8" placeholder="Repite tu contraseña"
            class="w-full bg-slate-800 border border-slate-600 text-slate-100 rounded-lg px-4 py-3 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-500 transition" />
        </div>
        <button type="submit" id="btnReset"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg py-3 text-sm
                 transition-all shadow-lg shadow-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
          Guardar contraseña
        </button>
      </form>
    </div>

    <p class="text-center text-slate-600 text-xs mt-6">CRM Subsidios &copy; 2026</p>
  </div>

<script>
  const SUPABASE_URL  = 'https://vomqfihcrhjcvxjsloob.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvbXFmaWhjcmhqY3Z4anNsb29iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5OTM3MDQsImV4cCI6MjA4ODU2OTcwNH0.uBgd-aOeochLcomuQM8o_R-Sfl_JJ-7WsB1-wSwLGIc';
  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  function mostrarAlerta(msg, tipo = 'error') {
    const el = document.getElementById('alerta');
    el.className = `mb-5 px-4 py-3 rounded-lg text-sm font-medium ${
      tipo === 'error' ? 'bg-red-900/60 text-red-300 border border-red-700'
      : tipo === 'ok'  ? 'bg-green-900/60 text-green-300 border border-green-700'
      : 'bg-amber-900/60 text-amber-300 border border-amber-700'
    }`;
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  async function init() {
    // Supabase procesa automáticamente el token del hash de la URL
    const { data: { session }, error } = await _supabase.auth.getSession();

    document.getElementById('cargando').classList.add('hidden');

    if (error || !session) {
      mostrarAlerta('El enlace no es válido o ya expiró. Solicita uno nuevo.', 'error');
      return;
    }

    document.getElementById('formReset').classList.remove('hidden');
  }

  document.getElementById('formReset').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwd1 = document.getElementById('pwd1').value;
    const pwd2 = document.getElementById('pwd2').value;
    if (pwd1 !== pwd2) { mostrarAlerta('Las contraseñas no coinciden'); return; }
    if (pwd1.length < 8) { mostrarAlerta('Mínimo 8 caracteres'); return; }

    const btn = document.getElementById('btnReset');
    btn.disabled = true;
    btn.textContent = 'Guardando…';

    const { error } = await _supabase.auth.updateUser({ password: pwd1 });
    if (error) {
      mostrarAlerta(error.message || 'Error al guardar');
      btn.disabled = false;
      btn.textContent = 'Guardar contraseña';
      return;
    }

    mostrarAlerta('Contraseña creada correctamente. Redirigiendo…', 'ok');
    setTimeout(() => window.location.href = '/index.html', 1500);
  });

  init();
</script>
</body>
</html>
