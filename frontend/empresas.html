<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM QueSubsidio — Seleccionar empresa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-from: #0f0a1e;
      --bg-via: #1e1050;
      --glass-bg: rgba(124,58,237,0.07);
      --glass-border: rgba(167,139,250,0.15);
      --heading: #f5f3ff;
      --muted: #a78bfa;
      --footer: #4c3d8a;
      --card-hover: rgba(124,58,237,0.18);
    }
    [data-theme="light"] {
      --bg-from: #f5f3ff;
      --bg-via: #ede9fe;
      --glass-bg: rgba(255,255,255,0.85);
      --glass-border: rgba(124,58,237,0.25);
      --heading: #1e1b4b;
      --muted: #7c3aed;
      --footer: #a78bfa;
      --card-hover: rgba(124,58,237,0.08);
    }
    body {
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-via) 60%, var(--bg-from) 100%);
      min-height: 100vh;
    }
    .glass { background: var(--glass-bg); backdrop-filter: blur(14px); border: 1px solid var(--glass-border); }
    .heading { color: var(--heading); }
    .muted   { color: var(--muted); }

    .empresa-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 1.25rem;
      padding: 2rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }
    .empresa-card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
    }
    .empresa-card:active { transform: translateY(-1px); }
    .empresa-avatar {
      width: 4rem; height: 4rem;
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 800; color: white;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }
    .empresa-nombre {
      font-size: 1.1rem; font-weight: 700;
      color: var(--heading);
    }
    .empresa-tag {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.75rem;
      border-radius: 9999px;
      background: rgba(124,58,237,0.15);
      color: var(--muted);
    }
    .empresa-arrow {
      color: var(--muted);
      transition: transform 0.2s, color 0.2s;
    }
    .empresa-card:hover .empresa-arrow {
      transform: translateX(4px);
      color: var(--heading);
    }

    .theme-btn {
      position: fixed; top: 1rem; right: 1rem;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 9999px; padding: 0.5rem; cursor: pointer;
      backdrop-filter: blur(8px); transition: all 0.2s; color: var(--muted);
    }
    .theme-btn:hover { color: var(--heading); }

    .logout-btn {
      position: fixed; top: 1rem; left: 1rem;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 9999px; padding: 0.5rem 1rem; cursor: pointer;
      backdrop-filter: blur(8px); transition: all 0.2s;
      color: var(--muted); font-size: 0.75rem; font-weight: 500;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .logout-btn:hover { color: var(--heading); }

    .skeleton {
      background: linear-gradient(90deg, rgba(124,58,237,0.1) 25%, rgba(124,58,237,0.2) 50%, rgba(124,58,237,0.1) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 1.25rem; height: 180px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">

  <!-- Salir (izquierda) -->
  <button class="logout-btn" id="btnLogout">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
    </svg>
    Salir
  </button>

  <!-- Barra superior derecha: Admin + tema -->
  <div style="position:fixed;top:1rem;right:1rem;display:flex;align-items:center;gap:0.5rem;z-index:50">
    <a href="/admin.html" id="btnAdmin" class="logout-btn hidden" style="position:static">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      Admin
    </a>
    <button class="theme-btn" id="themeToggle" title="Cambiar tema" style="position:static">
      <svg id="iconMoon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
      <svg id="iconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
    </button>
  </div>

  <div class="w-full max-w-3xl">
    <!-- Header -->
    <div class="text-center mb-10">
      <img src="https://vomqfihcrhjcvxjsloob.supabase.co/storage/v1/object/public/proyectos-imagenes/neuryto.jpeg" alt="CRM QueSubsidio" class="w-20 h-20 rounded-2xl object-cover mb-5 shadow-lg shadow-violet-500/30 mx-auto" />
      <h1 class="text-3xl font-bold heading">CRM QueSubsidio</h1>
      <p class="muted text-sm mt-2">Selecciona la empresa con la que vas a trabajar hoy</p>
    </div>

    <!-- Cards -->
    <div id="empresas-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-5">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <p id="error-msg" class="hidden text-center text-red-400 text-sm mt-6"></p>
  </div>

  <p class="fixed bottom-4 text-xs" style="color: var(--footer)">CRM QueSubsidio &copy; 2026 — Powered by QueSubsidio</p>

<script>
  // ── Tema ─────────────────────────────────────────────────
  const html = document.documentElement;
  const saved = localStorage.getItem('crm-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initTheme = saved || (sysDark ? 'dark' : 'light');
  html.setAttribute('data-theme', initTheme);
  document.getElementById('iconMoon').classList.toggle('hidden', initTheme === 'light');
  document.getElementById('iconSun').classList.toggle('hidden',  initTheme === 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('crm-theme', next);
    document.getElementById('iconMoon').classList.toggle('hidden', next === 'light');
    document.getElementById('iconSun').classList.toggle('hidden',  next === 'dark');
  });

  // ── Supabase ─────────────────────────────────────────────
  const SUPABASE_URL  = 'https://vomqfihcrhjcvxjsloob.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvbXFmaWhjcmhqY3Z4anNsb29iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5OTM3MDQsImV4cCI6MjA4ODU2OTcwNH0.uBgd-aOeochLcomuQM8o_R-Sfl_JJ-7WsB1-wSwLGIc';
  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // ── Auth guard ────────────────────────────────────────────
  async function init() {
    const { data: { user }, error } = await _supabase.auth.getUser();
    if (!user || error) { window.location.href = '/login.html'; return; }

    const { data: { session } } = await _supabase.auth.getSession();
    const token = session?.access_token;

    try {
      const [resEmpresas, resPerfil] = await Promise.all([
        fetch('/api/empresas',      { headers: { Authorization: `Bearer ${token}` } }),
        fetch('/api/usuarios/me',   { headers: { Authorization: `Bearer ${token}` } }),
      ]);
      if (resEmpresas.status === 401) { await _supabase.auth.signOut(); window.location.href = '/login.html'; return; }
      const empresas = await resEmpresas.json();
      const perfil   = resPerfil.ok ? await resPerfil.json() : {};
      if (perfil.rol === 'owner') {
        document.getElementById('btnAdmin').classList.remove('hidden');
      }
      renderEmpresas(empresas);
    } catch (e) {
      document.getElementById('error-msg').textContent = 'Error al cargar empresas: ' + e.message;
      document.getElementById('error-msg').classList.remove('hidden');
      document.getElementById('empresas-grid').innerHTML = '';
    }
  }

  function iniciales(nombre) {
    return nombre.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }

  function renderEmpresas(empresas) {
    const grid = document.getElementById('empresas-grid');
    if (!empresas.length) {
      grid.className = 'flex justify-center';
      grid.innerHTML = '<p class="text-center muted text-sm py-10">No hay empresas activas.</p>';
      return;
    }
    const n = empresas.length;
    grid.className = n === 1
      ? 'flex justify-center'
      : n === 2
        ? 'grid grid-cols-1 sm:grid-cols-2 gap-5 justify-items-center'
        : 'grid grid-cols-1 sm:grid-cols-3 gap-5';
    const extraClass = n === 1 ? ' w-full max-w-xs' : '';
    grid.innerHTML = empresas.map((e, idx) => {
      const color = e.color_marca || '#7c3aed';
      const shadow = color + '40';
      return `
        <button class="empresa-card${extraClass}" data-idx="${idx}"
          style="--accent:${color}">
          <div class="empresa-avatar" style="background:${color}; box-shadow: 0 8px 24px ${shadow}">
            ${e.logo_url
              ? `<img src="${e.logo_url}" class="w-full h-full object-contain rounded-xl" />`
              : iniciales(e.nombre)
            }
          </div>
          <div>
            <p class="empresa-nombre">${e.nombre}</p>
          </div>
          <span class="empresa-tag">Entrar</span>
          <svg class="empresa-arrow w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>`;
    }).join('');

    grid.querySelectorAll('.empresa-card').forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        sessionStorage.setItem('crm_empresa', JSON.stringify(empresas[idx]));
        sessionStorage.removeItem('crm_inmobiliaria');
        sessionStorage.removeItem('crm_proyecto');
        window.location.href = '/inmobiliaria.html';
      });
    });
  }

  document.getElementById('btnLogout').addEventListener('click', async () => {
    await _supabase.auth.signOut();
    sessionStorage.removeItem('crm_empresa');
    window.location.href = '/login.html';
  });

  init();
</script>
</body>
</html>
