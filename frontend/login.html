<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM QueSubsidio — Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-from: #0f0a1e;
      --bg-via: #1e1050;
      --glass-bg: rgba(124,58,237,0.07);
      --glass-border: rgba(167,139,250,0.15);
      --label: #c4b5fd;
      --muted: #a78bfa;
      --footer: #4c3d8a;
      --inp-bg: #1a1035;
      --inp-border: #4c1d95;
      --inp-text: #ede9fe;
      --inp-ph: #7c5cbf;
      --heading: #f5f3ff;
    }
    [data-theme="light"] {
      --bg-from: #f5f3ff;
      --bg-via: #ede9fe;
      --glass-bg: rgba(255,255,255,0.85);
      --glass-border: rgba(124,58,237,0.25);
      --label: #5b21b6;
      --muted: #7c3aed;
      --footer: #a78bfa;
      --inp-bg: #ffffff;
      --inp-border: #ddd6fe;
      --inp-text: #1e1b4b;
      --inp-ph: #a78bfa;
      --heading: #1e1b4b;
    }
    body {
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-via) 60%, var(--bg-from) 100%);
      min-height: 100vh;
    }
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
    }
    .inp {
      width: 100%;
      background: var(--inp-bg);
      border: 1px solid var(--inp-border);
      color: var(--inp-text);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      outline: none;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .inp:focus { box-shadow: 0 0 0 2px #7c3aed; border-color: transparent; }
    .inp::placeholder { color: var(--inp-ph); }
    .inp-pw { padding-right: 3rem; }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px var(--inp-bg) inset;
      -webkit-text-fill-color: var(--inp-text);
    }
    .lbl  { display: block; color: var(--label); font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
    .heading { color: var(--heading); }
    .muted { color: var(--muted); }
    .toggle-icon { color: var(--muted); }
    .toggle-icon:hover { color: var(--heading); }

    .theme-btn {
      position: fixed; top: 1rem; right: 1rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 9999px;
      padding: 0.5rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
      color: var(--muted);
    }
    .theme-btn:hover { color: var(--heading); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <!-- Toggle claro/oscuro -->
  <button class="theme-btn" id="themeToggle" title="Cambiar tema">
    <svg id="iconMoon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
    </svg>
    <svg id="iconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
    </svg>
  </button>

  <div class="w-full max-w-md">
    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-violet-600 mb-4 shadow-lg shadow-violet-500/30 hover:opacity-80 transition-opacity">
        <!-- Icono red neuronal -->
        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none">
          <circle cx="4"    cy="6"    r="1.8" fill="currentColor"/>
          <circle cx="4"    cy="12"   r="1.8" fill="currentColor"/>
          <circle cx="4"    cy="18"   r="1.8" fill="currentColor"/>
          <circle cx="12.5" cy="8.5"  r="1.8" fill="currentColor"/>
          <circle cx="12.5" cy="15.5" r="1.8" fill="currentColor"/>
          <circle cx="20"   cy="12"   r="1.8" fill="currentColor"/>
          <line x1="5.8" y1="6.3"  x2="10.7" y2="8.2"  stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="6.6"  x2="10.7" y2="15.0" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="12"   x2="10.7" y2="8.8"  stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="12"   x2="10.7" y2="15.2" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="17.7" x2="10.7" y2="9.0"  stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="5.8" y1="17.8" x2="10.7" y2="15.5" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="14.3" y1="8.8"  x2="18.2" y2="11.5" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
          <line x1="14.3" y1="15.2" x2="18.2" y2="12.5" stroke="currentColor" stroke-width="0.9" opacity="0.6"/>
        </svg>
      </a>
      <h1 class="text-2xl font-bold heading">CRM QueSubsidio</h1>
      <p class="muted text-sm mt-1">Ingresa con tu cuenta</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-2xl p-8 shadow-2xl">

      <!-- Alert -->
      <div id="alerta" class="hidden mb-5 px-4 py-3 rounded-lg text-sm font-medium"></div>

      <!-- Login form -->
      <form id="formLogin" class="space-y-5">
        <div>
          <label class="lbl">Correo electrónico</label>
          <input id="correo" type="email" autocomplete="email" required
            placeholder="tu@correo.cl" class="inp" />
        </div>
        <div>
          <label class="lbl">Contraseña</label>
          <div class="relative">
            <input id="password" type="password" autocomplete="current-password" required
              placeholder="••••••••" class="inp inp-pw" />
            <button type="button" id="togglePwd"
              class="toggle-icon absolute right-3 top-1/2 -translate-y-1/2 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
                     -1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" id="btnLogin"
          class="w-full bg-violet-600 hover:bg-violet-500 active:bg-violet-700 text-white font-semibold
                 rounded-lg py-3 text-sm transition-all shadow-lg shadow-violet-500/20
                 disabled:opacity-50 disabled:cursor-not-allowed">
          Iniciar sesión
        </button>
        <div class="text-center pt-1">
          <button type="button" onclick="mostrarRecuperar()"
            class="text-xs text-violet-400 hover:text-violet-300 hover:underline transition">
            ¿Olvidaste tu contraseña?
          </button>
        </div>
      </form>

      <!-- Recuperar contraseña -->
      <form id="formRecuperar" class="hidden space-y-5">
        <div class="mb-2">
          <h2 class="font-semibold heading text-base">Recuperar contraseña</h2>
          <p class="text-sm muted mt-1">Te enviaremos un enlace para crear una nueva contraseña.</p>
        </div>
        <div>
          <label class="lbl">Correo electrónico</label>
          <input id="correoRecuperar" type="email" required autocomplete="email"
            placeholder="tu@correo.cl" class="inp" />
        </div>
        <button type="submit" id="btnRecuperar"
          class="w-full bg-violet-600 hover:bg-violet-500 text-white font-semibold
                 rounded-lg py-3 text-sm transition-all shadow-lg shadow-violet-500/20
                 disabled:opacity-50 disabled:cursor-not-allowed">
          Enviar enlace
        </button>
        <div class="text-center">
          <button type="button" onclick="mostrarLogin()"
            class="text-xs text-violet-400 hover:text-violet-300 hover:underline transition">
            ← Volver al inicio de sesión
          </button>
        </div>
      </form>

      <!-- Change password form (provisional) -->
      <form id="formCambio" class="hidden space-y-5">
        <div class="mb-2">
          <div class="flex items-center gap-2 text-amber-400 mb-1">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            <span class="font-semibold text-sm">Contraseña provisional detectada</span>
          </div>
          <p class="text-sm muted">Crea una contraseña permanente para continuar.</p>
        </div>
        <div>
          <label class="lbl">Nueva contraseña</label>
          <input id="nuevaPwd" type="password" required minlength="8"
            placeholder="Mínimo 8 caracteres" class="inp" />
        </div>
        <div>
          <label class="lbl">Confirmar contraseña</label>
          <input id="confirmarPwd" type="password" required minlength="8"
            placeholder="Repite tu contraseña" class="inp" />
        </div>
        <button type="submit" id="btnCambio"
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold
                 rounded-lg py-3 text-sm transition-all shadow-lg shadow-emerald-500/20
                 disabled:opacity-50 disabled:cursor-not-allowed">
          Guardar nueva contraseña
        </button>
      </form>
    </div>

    <p class="text-center text-xs mt-6" style="color: var(--footer)">CRM QueSubsidio &copy; 2026</p>
  </div>

<script>
  // ── Tema claro / oscuro ──────────────────────────────────────────────────
  const html = document.documentElement;
  const savedTheme = localStorage.getItem('crm-theme');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initTheme  = savedTheme || (systemDark ? 'dark' : 'light');
  html.setAttribute('data-theme', initTheme);
  document.getElementById('iconMoon').classList.toggle('hidden', initTheme === 'light');
  document.getElementById('iconSun').classList.toggle('hidden',  initTheme === 'dark');

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('crm-theme', next);
    document.getElementById('iconMoon').classList.toggle('hidden', next === 'light');
    document.getElementById('iconSun').classList.toggle('hidden',  next === 'dark');
  });

  // ── Supabase ─────────────────────────────────────────────────────────────
  const SUPABASE_URL  = 'https://vomqfihcrhjcvxjsloob.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvbXFmaWhjcmhqY3Z4anNsb29iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5OTM3MDQsImV4cCI6MjA4ODU2OTcwNH0.uBgd-aOeochLcomuQM8o_R-Sfl_JJ-7WsB1-wSwLGIc';
  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  let _session = null;

  function mostrarAlerta(msg, tipo = 'error') {
    const el = document.getElementById('alerta');
    el.className = `mb-5 px-4 py-3 rounded-lg text-sm font-medium ${
      tipo === 'error' ? 'bg-red-900/60 text-red-300 border border-red-700'
      : tipo === 'ok'  ? 'bg-green-900/60 text-green-300 border border-green-700'
      : 'bg-amber-900/60 text-amber-300 border border-amber-700'
    }`;
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  function ocultarAlerta() { document.getElementById('alerta').classList.add('hidden'); }

  document.getElementById('togglePwd').addEventListener('click', () => {
    const pwd = document.getElementById('password');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarAlerta();
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Ingresando…';
    const correo   = document.getElementById('correo').value.trim();
    const password = document.getElementById('password').value;
    try {
      const { data, error } = await _supabase.auth.signInWithPassword({ email: correo, password });
      if (error) throw error;
      _session = data.session;
      const res  = await fetch('/api/usuarios/me', {
        headers: { Authorization: `Bearer ${_session.access_token}` }
      });
      const user = await res.json();
      if (user.password_provisional) {
        document.getElementById('formLogin').classList.add('hidden');
        document.getElementById('formCambio').classList.remove('hidden');
        mostrarAlerta('Debes crear una contraseña permanente para continuar.', 'info');
      } else {
        window.location.href = '/empresas';
      }
    } catch (err) {
      mostrarAlerta(err.message || 'Error al iniciar sesión');
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
    }
  });

  document.getElementById('formCambio').addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarAlerta();
    const btn    = document.getElementById('btnCambio');
    const nueva  = document.getElementById('nuevaPwd').value;
    const conf   = document.getElementById('confirmarPwd').value;
    if (nueva !== conf) { mostrarAlerta('Las contraseñas no coinciden'); return; }
    if (nueva.length < 8) { mostrarAlerta('Mínimo 8 caracteres'); return; }
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    try {
      const res = await fetch('/api/auth/cambiar-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_session.access_token}` },
        body: JSON.stringify({ nueva_password: nueva }),
      });
      if (!res.ok) throw new Error(await res.text());
      mostrarAlerta('✓ Contraseña actualizada. Redirigiendo…', 'ok');
      setTimeout(() => window.location.href = '/empresas', 1500);
    } catch (err) {
      mostrarAlerta(err.message || 'Error al cambiar contraseña');
      btn.disabled = false;
      btn.textContent = 'Guardar nueva contraseña';
    }
  });

  function mostrarLogin() {
    ocultarAlerta();
    document.getElementById('formLogin').classList.remove('hidden');
    document.getElementById('formCambio').classList.add('hidden');
    document.getElementById('formRecuperar').classList.add('hidden');
  }
  function mostrarRecuperar() {
    ocultarAlerta();
    document.getElementById('formLogin').classList.add('hidden');
    document.getElementById('formRecuperar').classList.remove('hidden');
  }

  document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn    = document.getElementById('btnRecuperar');
    const correo = document.getElementById('correoRecuperar').value.trim();
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    ocultarAlerta();
    try {
      const { error } = await _supabase.auth.resetPasswordForEmail(correo, {
        redirectTo: 'https://quesubsidio.cl/reset-password',
      });
      if (error) throw error;
      mostrarAlerta('Te enviamos el enlace. Revisa tu correo (y la carpeta de spam).', 'ok');
      document.getElementById('formRecuperar').classList.add('hidden');
    } catch (err) {
      mostrarAlerta(err.message || 'Error al enviar el correo');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar enlace';
    }
  });

  _supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = '/empresas';
  });
</script>
</body>
</html>
